<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Market — CryptoDash</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
    <header class="topbar">
        <a href="/dashboard" class="brand">
            <span class="brand-mark">₿</span>
            <span>Crypto<span class="accent">Dash</span></span>
        </a>
        <nav class="main-nav">
            <a href="/dashboard">Dashboard</a>
            <a href="/crypto" class="active">Markets</a>
            <a href="/watchlist">Watchlist</a>
            <a href="/portfolio">Portfolio</a>
            <a href="/profile">Profile</a>
            <a href="/settings">Settings</a>
            <a href="/logout" class="btn btn-ghost">Logout</a>
        </nav>
    </header>
    <main class="dashboard">
        <div class="page-head">
            <div>
                <span class="eyebrow">MARKET</span>
                <h1>Cryptocurrency Market</h1>
                <p class="muted">Explore live cryptocurrency prices and market data.</p>
            </div>
        </div>
        <div class="market-toolbar">
            <div class="search-box">
                <span>⌕</span>
                <input id="cryptoSearch" type="text" placeholder="Search cryptocurrency...">
            </div>
            <div class="market-status">
                <span class="live-dot">●</span>
                LIVE
            </div>
        </div>
        <section class="panel market-panel">
            <div class="panel-head">
                <div>
                    <span class="eyebrow">LIVE DATA</span>
                    <h2>Top Cryptocurrencies</h2>
                </div>
                <span class="market-count">50 Assets</span>
            </div>
            <div class="table-wrap">
                <table class="crypto-market-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Coin</th>
                            <th>Price</th>
                            <th>24h Change</th>
                            <th>Market Cap</th>
                            <th>Volume</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="cryptoTable">
                        <tr>
                            <td colspan="7" class="empty">
                                Loading market data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
